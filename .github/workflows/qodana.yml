name: Qodana Code Quality & Security Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Scan
        if: env.QODANA_TOKEN != ''
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        uses: JetBrains/qodana-action@v2024.3
