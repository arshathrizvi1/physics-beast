name: Qodana Code Quality & Security Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  qodana:
    name: JetBrains Qodana Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & patch licenses
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          node scripts/patch-licenses.mjs

      - name: Generate Qodana LCOV coverage
        run: |
          npm run test:coverage
          ls -lh .qodana/code-coverage/lcov.info

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: --linter qodana-js --print-problems
          pr-mode: false
          upload-result: false
          use-caches: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJwcm9qZWN0IjoiMjBxS2QiLCJvcmdhbml6YXRpb24iOiJuZVZnOSIsInRva2VuIjoiNlBWYU0iLCJ0b2tlbl90eXBlIjoicHJvamVjdCJ9.6uWj26_7I_ZKX-743KKM2DA8puheY6Uqer2zgTWqpAU' }}
