name: Build Flutter Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'brilliant_academy_flutter/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd brilliant_academy_flutter
          flutter pub get

      - name: Build Release APK
        run: |
          cd brilliant_academy_flutter
          flutter build apk --release

      - name: Copy APK to Website Public Folder
        run: |
          mkdir -p public
          cp brilliant_academy_flutter/build/app/outputs/flutter-apk/app-release.apk public/Brilliant-Academy-Native.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brilliant-Academy-Native-APK
          path: public/Brilliant-Academy-Native.apk
          retention-days: 30

      - name: Commit and Push Native APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/Brilliant-Academy-Native.apk
          git commit -m "chore: deploy latest native Flutter release APK [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
