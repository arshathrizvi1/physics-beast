name: 📥 Video Download & Transcode Pipeline (YouTube/Zoom -> R2 + Bunny)

on:
  repository_dispatch:
    types: [youtube-download, zoom-download, video-download]
  workflow_dispatch:
    inputs:
      url:
        description: 'Video URL (YouTube or Zoom)'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      title:
        description: 'Video Title'
        required: false
        default: 'Manual Test Video'
      password:
        description: 'Optional Password (e.g. for Zoom)'
        required: false
        default: ''

jobs:
  process-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      VIDEO_URL:       "${{ github.event.inputs.url || github.event.client_payload.url }}"
      VIDEO_PASSWORD:  "${{ github.event.inputs.password || github.event.client_payload.password }}"
      VIDEO_TITLE:     "${{ github.event.inputs.title || github.event.client_payload.title }}"
      VIDEO_DOC_ID:    "${{ github.event.client_payload.metadata.videoDocId || 'manual_test_doc' }}"
      FOLDER_ID:       "${{ github.event.client_payload.metadata.selectedFolderId || 'none' }}"
      COURSE_FOLDER:   "${{ github.event.client_payload.metadata.selectedCourseFolderId || 'none' }}"
      ITEM_TYPE:       "${{ github.event.client_payload.metadata.selectedItemType || 'folder' }}"
      COURSE_ID:       "${{ github.event.client_payload.metadata.selectedCourseId || 'none' }}"
      ORIGINAL_YT_URL: "${{ github.event.client_payload.metadata.originalYoutubeUrl || github.event.inputs.url }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Job Info
        run: |
          echo "=================================================="
          echo "  Brilliant Academy - Video Pipeline (Serverless)"
          echo "=================================================="
          echo "Title   : $VIDEO_TITLE"
          echo "URL     : $VIDEO_URL"
          echo "DocID   : $VIDEO_DOC_ID"
          echo "Folder  : $FOLDER_ID"
          echo "=================================================="

      - name: Setup Deno (YouTube JS Runtime)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp, FFmpeg, PO-Token Provider & Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip
          sudo curl -sSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          python3 -m pip install --upgrade pip yt-dlp bgutil-ytdlp-pot-provider || true
          
          # Start PO-Token generation server (BotGuard emulator)
          docker run -d --name bgutil-pot -p 4416:4416 --restart=always ghcr.io/jim60105/bgutil-pot:latest server || true
          sleep 4
          curl -s http://127.0.0.1:4416/ping || curl -s http://127.0.0.1:4416 || echo "POT server starting up"

          # Copy plugin so both standalone yt-dlp and python3 -m yt_dlp load bgutil plugin
          mkdir -p ~/.local/share/yt-dlp/plugins
          sudo mkdir -p /etc/yt-dlp/plugins || true
          python3 -c "import yt_dlp_plugins, shutil, os; p=yt_dlp_plugins.__path__[0]; shutil.copytree(p, os.path.expanduser('~/.local/share/yt-dlp/plugins/yt_dlp_plugins'), dirs_exist_ok=True); print('Plugin copied successfully to yt-dlp search paths')" 2>/dev/null || true
          sudo python3 -c "import yt_dlp_plugins, shutil, os; p=yt_dlp_plugins.__path__[0]; shutil.copytree(p, '/etc/yt-dlp/plugins/yt_dlp_plugins', dirs_exist_ok=True)" 2>/dev/null || true

          npm install playwright || true
          python3 -m yt_dlp --version
          yt-dlp --version
          ffmpeg -version | head -n 1
          deno --version

      - name: Setup Cloudflare WARP Proxy (YouTube Bot Bypass)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y cloudflare-warp || true
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
          warp-cli --accept-tos mode proxy 2>/dev/null || warp-cli --accept-tos set-mode proxy 2>/dev/null || true
          warp-cli --accept-tos proxy port 40000 2>/dev/null || warp-cli --accept-tos set-proxy-port 40000 2>/dev/null || true
          warp-cli --accept-tos connect 2>/dev/null || true
          sleep 3
          curl -s --socks5 127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace | head -n 4 || echo "WARP starting in background"

      - name: Setup YouTube Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" | base64 --decode > /tmp/cookies.txt
            echo "Cookies loaded successfully."
          else
            echo "No YT_COOKIES secret found. Proceeding without cookies."
          fi

      - name: Download Video
        run: |
          python3 scripts/download_video.py "$VIDEO_URL" "$VIDEO_PASSWORD"

          if [ ! -f /tmp/video.mp4 ]; then
            echo "ERROR: Video download failed - file not found"
            exit 1
          fi

          FILE_SIZE=$(du -sh /tmp/video.mp4 | cut -f1)
          echo "Download complete! Size: $FILE_SIZE"

      - name: Transcode Multi-Quality HLS (720p, 480p, 360p)
        id: transcode-hls
        run: |
          mkdir -p /tmp/hls_out
          python3 scripts/generate_hls.py /tmp/video.mp4 /tmp/hls_out
          
          if [ ! -f /tmp/hls_out/master.m3u8 ]; then
            echo "WARNING: master.m3u8 not generated"
          else
            echo "Multi-quality HLS transcode completed successfully!"
          fi

      - name: Upload HLS to Cloudflare R2
        id: r2-upload
        run: |
          if [ -n "${{ secrets.R2_ACCOUNT_ID }}" ] && [ -n "${{ secrets.R2_BUCKET_NAME }}" ] && [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ]; then
            SAFE_ID=$(echo "$VIDEO_DOC_ID" | tr -dc 'a-zA-Z0-9_-')
            if [ -z "$SAFE_ID" ]; then
              SAFE_ID="vid_$(date +%s)"
            fi
            R2_FOLDER="vid_${SAFE_ID}_$(date +%s)"
            echo "Uploading HLS stream to Cloudflare R2: videos/$R2_FOLDER ..."

            export AWS_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}"
            export AWS_DEFAULT_REGION="auto"
            R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

            # 1. Upload .m3u8 playlist files with apple.mpegurl content type
            aws s3 sync /tmp/hls_out "s3://${{ secrets.R2_BUCKET_NAME }}/videos/${R2_FOLDER}" \
              --endpoint-url "$R2_ENDPOINT" \
              --exclude "*" --include "*.m3u8" \
              --content-type "application/vnd.apple.mpegurl" \
              --cache-control "public, max-age=300"

            # 2. Upload .ts segment slices with video/mp2t content type and immutable cache
            aws s3 sync /tmp/hls_out "s3://${{ secrets.R2_BUCKET_NAME }}/videos/${R2_FOLDER}" \
              --endpoint-url "$R2_ENDPOINT" \
              --exclude "*" --include "*.ts" \
              --content-type "video/mp2t" \
              --cache-control "public, max-age=31536000, immutable"

            if [ -n "${{ secrets.R2_PUBLIC_URL }}" ]; then
              CLEAN_R2_PUBLIC=$(echo "${{ secrets.R2_PUBLIC_URL }}" | sed 's:/*$::')
              FINAL_R2_URL="${CLEAN_R2_PUBLIC}/videos/${R2_FOLDER}/master.m3u8"
            else
              FINAL_R2_URL="https://${{ secrets.R2_BUCKET_NAME }}.${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com/videos/${R2_FOLDER}/master.m3u8"
            fi

            echo "r2_url=$FINAL_R2_URL" >> $GITHUB_OUTPUT
            echo "✅ Uploaded to Cloudflare R2: $FINAL_R2_URL"
          else
            echo "⚠️ Cloudflare R2 secrets not configured, skipping R2."
            echo "r2_url=" >> $GITHUB_OUTPUT
          fi

      - name: Upload to BunnyCDN (Optional Fallback)
        id: bunny-upload
        run: |
          if [ -n "${{ secrets.BUNNY_API_KEY }}" ] && [ -n "${{ secrets.BUNNY_LIBRARY_ID }}" ]; then
            echo "Attempting optional upload to BunnyCDN..."
            RESPONSE=$(curl -s -X POST \
              "https://video.bunnycdn.com/library/${{ secrets.BUNNY_LIBRARY_ID }}/videos" \
              -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"title\": \"$VIDEO_TITLE\"}")

            VIDEO_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('guid',''))" 2>/dev/null || true)

            if [ -n "$VIDEO_ID" ]; then
              FILE_SIZE=$(stat -c%s /tmp/video.mp4)
              echo "Uploading $FILE_SIZE bytes to BunnyCDN (Video ID: $VIDEO_ID)..."

              HTTP_STATUS=$(curl -s -o /tmp/upload_resp.txt -w "%{http_code}" \
                -X PUT \
                "https://video.bunnycdn.com/library/${{ secrets.BUNNY_LIBRARY_ID }}/videos/${VIDEO_ID}" \
                -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
                -H "Content-Type: application/octet-stream" \
                -H "Content-Length: ${FILE_SIZE}" \
                --data-binary @/tmp/video.mp4)

              if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
                echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
                echo "✅ Uploaded to BunnyCDN successfully: $VIDEO_ID"
              else
                echo "ℹ️ BunnyCDN upload returned HTTP $HTTP_STATUS (inactive/expired). Proceeding with Cloudflare R2 only."
                echo "video_id=" >> $GITHUB_OUTPUT
              fi
            else
              echo "ℹ️ BunnyCDN entry creation skipped/failed. Proceeding with Cloudflare R2 only."
              echo "video_id=" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️ BunnyCDN credentials not provided. Proceeding with Cloudflare R2 only."
            echo "video_id=" >> $GITHUB_OUTPUT
          fi

      - name: Notify Website Webhook
        run: |
          R2_URL="${{ steps.r2-upload.outputs.r2_url }}"
          VIDEO_ID="${{ steps.bunny-upload.outputs.video_id }}"

          if [ -z "$R2_URL" ] && [ -z "$VIDEO_ID" ]; then
            echo "ERROR: Neither Cloudflare R2 nor BunnyCDN upload succeeded."
            exit 1
          fi

          python3 -c "
          import json, urllib.request, urllib.error

          metadata = {
            'videoDocId':              '$VIDEO_DOC_ID',
            'videoTitle':              '$VIDEO_TITLE',
            'selectedFolderId':        '$FOLDER_ID',
            'selectedCourseFolderId':  '$COURSE_FOLDER',
            'selectedItemType':        '$ITEM_TYPE',
            'selectedCourseId':        '$COURSE_ID',
            'originalYoutubeUrl':      '$ORIGINAL_YT_URL'
          }

          payload = {
            'secret':    '${{ secrets.RTMP_CALLBACK_SECRET || secrets.WEBHOOK_SECRET }}',
            'r2Url':     '$R2_URL',
            'videoId':   '$VIDEO_ID',
            'libraryId': '${{ secrets.BUNNY_LIBRARY_ID }}',
            'metadata':  metadata
          }

          raw_url = '${{ secrets.WEBSITE_URL }}'.strip().rstrip('/')
          webhook_url = f'{raw_url}/api/bunny/aws-webhook'
          print(f'Sending webhook notification to: {webhook_url}...')

          headers = {
              'Content-Type': 'application/json',
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers=headers
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode('utf-8')
                  print(f'Webhook responded with status: {resp.status}, body: {body}')
          except urllib.error.HTTPError as e:
              err_text = e.read().decode('utf-8') if e.fp else ''
              print(f'Webhook HTTP Error {e.code}: {err_text}')
              # If manual test without real document, report cleanly without failing entire run
              if '$VIDEO_DOC_ID' == 'manual_test_doc':
                  print('Notice: Manual test completed! Video was processed and stored successfully.')
              else:
                  raise e
          except Exception as e:
              print(f'Error notifying webhook: {e}')
              if '$VIDEO_DOC_ID' == 'manual_test_doc':
                  print('Notice: Manual test completed! Video was processed and stored successfully.')
              else:
                  raise e
          "

      - name: Notify Website of Failure
        if: failure()
        run: |
          python3 -c "
          import json, urllib.request, urllib.error

          metadata = {
            'videoDocId':              '$VIDEO_DOC_ID',
            'videoTitle':              '$VIDEO_TITLE',
            'selectedFolderId':        '$FOLDER_ID',
            'selectedCourseFolderId':  '$COURSE_FOLDER',
            'selectedItemType':        '$ITEM_TYPE',
            'selectedCourseId':        '$COURSE_ID'
          }

          payload = {
            'secret':    '${{ secrets.RTMP_CALLBACK_SECRET || secrets.WEBHOOK_SECRET }}',
            'error':     'GitHub Actions video processing pipeline failed.',
            'metadata':  metadata,
            'libraryId': ''
          }

          raw_url = '${{ secrets.WEBSITE_URL }}'.strip().rstrip('/')
          webhook_url = f'{raw_url}/api/bunny/aws-webhook'
          headers = {
              'Content-Type': 'application/json',
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers=headers
          )
          try:
              urllib.request.urlopen(req, timeout=30)
              print('Failure notification sent to website.')
          except Exception as e:
              print(f'Failed to send failure webhook: {e}')
          " || true
