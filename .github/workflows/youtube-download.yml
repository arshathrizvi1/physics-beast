name: YouTube Video Download & Upload to BunnyCDN

on:
  repository_dispatch:
    types: [youtube-download]

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VIDEO_URL:     "${{ github.event.client_payload.url }}"
      VIDEO_TITLE:   "${{ github.event.client_payload.title }}"
      VIDEO_DOC_ID:  "${{ github.event.client_payload.metadata.videoDocId }}"
      FOLDER_ID:     "${{ github.event.client_payload.metadata.selectedFolderId }}"
      COURSE_FOLDER: "${{ github.event.client_payload.metadata.selectedCourseFolderId }}"
      ITEM_TYPE:     "${{ github.event.client_payload.metadata.selectedItemType }}"
      COURSE_ID:     "${{ github.event.client_payload.metadata.selectedCourseId }}"

    steps:
      - name: Print Job Info
        run: |
          echo "======================================"
          echo "  Brilliant Academy - YouTube Pipeline"
          echo "======================================"
          echo "Title   : $VIDEO_TITLE"
          echo "URL     : $VIDEO_URL"
          echo "DocID   : $VIDEO_DOC_ID"
          echo "Folder  : $FOLDER_ID"
          echo "======================================"

      - name: Install yt-dlp
        run: |
          sudo curl -sSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Setup YouTube Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" | base64 --decode > /tmp/cookies.txt
            echo "Cookies loaded."
          else
            echo "No cookies provided."
          fi

      - name: Download YouTube Video (720p)
        run: |
          COOKIES_ARG=""
          if [ -f /tmp/cookies.txt ]; then
            COOKIES_ARG="--cookies /tmp/cookies.txt"
            echo "Using cookies for authentication."
          fi

          yt-dlp \
            --extractor-args "youtube:player_client=ios" \
            $COOKIES_ARG \
            --format "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=720]+bestaudio/best[height<=720]/best" \
            --merge-output-format mp4 \
            --retries 10 \
            --fragment-retries 10 \
            --retry-sleep 5 \
            --add-header "Accept-Language:en-US,en;q=0.9" \
            --no-playlist \
            --progress \
            -o "/tmp/video.mp4" \
            "$VIDEO_URL"

          if [ ! -f /tmp/video.mp4 ]; then
            echo "ERROR: Download failed - file not found"
            exit 1
          fi

          FILE_SIZE=$(du -sh /tmp/video.mp4 | cut -f1)
          echo "Download complete. File size: $FILE_SIZE"

      - name: Create Video Entry in BunnyCDN
        id: bunny-create
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://video.bunnycdn.com/library/${{ secrets.BUNNY_LIBRARY_ID }}/videos" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"title\": \"$VIDEO_TITLE\"}")

          echo "Bunny response: $RESPONSE"

          VIDEO_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('guid','ERROR'))")

          if [ -z "$VIDEO_ID" ] || [ "$VIDEO_ID" = "ERROR" ]; then
            echo "ERROR: Failed to create Bunny video. Response: $RESPONSE"
            exit 1
          fi

          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT
          echo "Bunny video created: $VIDEO_ID"

      - name: Upload MP4 to BunnyCDN
        run: |
          VIDEO_ID="${{ steps.bunny-create.outputs.video_id }}"
          FILE_SIZE=$(stat -c%s /tmp/video.mp4)
          echo "Uploading ${FILE_SIZE} bytes..."

          HTTP_STATUS=$(curl -s -o /tmp/upload_resp.txt -w "%{http_code}" \
            -X PUT \
            "https://video.bunnycdn.com/library/${{ secrets.BUNNY_LIBRARY_ID }}/videos/${VIDEO_ID}" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
            -H "Content-Type: application/octet-stream" \
            -H "Content-Length: ${FILE_SIZE}" \
            --data-binary @/tmp/video.mp4)

          cat /tmp/upload_resp.txt
          echo "Upload status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "ERROR: Upload failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Upload complete!"
          rm -f /tmp/video.mp4

      - name: Notify Website Webhook
        run: |
          VIDEO_ID="${{ steps.bunny-create.outputs.video_id }}"

          # Build metadata JSON safely using python
          METADATA=$(python3 -c "
          import json
          m = {
            'videoDocId':              '$VIDEO_DOC_ID',
            'videoTitle':              '$VIDEO_TITLE',
            'selectedFolderId':        '$FOLDER_ID',
            'selectedCourseFolderId':  '$COURSE_FOLDER',
            'selectedItemType':        '$ITEM_TYPE',
            'selectedCourseId':        '$COURSE_ID'
          }
          print(json.dumps(m))
          ")

          PAYLOAD=$(python3 -c "
          import json
          payload = {
            'secret':    '${{ secrets.WEBHOOK_SECRET }}',
            'videoId':   '$VIDEO_ID',
            'libraryId': '${{ secrets.BUNNY_LIBRARY_ID }}',
            'metadata':  $METADATA
          }
          print(json.dumps(payload))
          ")

          HTTP_STATUS=$(curl -s -o /tmp/webhook_resp.txt -w "%{http_code}" \
            -X POST \
            "${{ secrets.WEBSITE_URL }}/api/bunny/aws-webhook" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          cat /tmp/webhook_resp.txt
          echo "Webhook status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "WARNING: Webhook returned $HTTP_STATUS - video uploaded but DB may not be updated"
          else
            echo "Website notified successfully!"
          fi

      - name: Notify Website of Failure
        if: failure()
        run: |
          METADATA=$(python3 -c "
          import json
          m = {
            'videoDocId':              '$VIDEO_DOC_ID',
            'videoTitle':              '$VIDEO_TITLE',
            'selectedFolderId':        '$FOLDER_ID',
            'selectedCourseFolderId':  '$COURSE_FOLDER',
            'selectedItemType':        '$ITEM_TYPE',
            'selectedCourseId':        '$COURSE_ID'
          }
          print(json.dumps(m))
          ")

          curl -s -X POST \
            "${{ secrets.WEBSITE_URL }}/api/bunny/aws-webhook" \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.WEBHOOK_SECRET }}\",\"error\":\"GitHub Actions download failed\",\"metadata\":$METADATA,\"libraryId\":\"\"}" \
            || true
