name: Build Android APK (Legacy Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & sync Capacitor
        run: |
          cd android-app
          npm install
          npx @capacitor/cli sync android

      - name: Build Android Release APK
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK and Move to Public
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android-app/android/app/build/outputs/apk/release
          EFFECTIVE_PASS="${KEYSTORE_PASS:-$(openssl rand -hex 16)}"
          keytool -genkey -v -keystore release.keystore -alias brilliant -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Brilliant Academy, OU=IT, O=Brilliant Academy, L=City, ST=State, C=US" -storepass "$EFFECTIVE_PASS" -keypass "$EFFECTIVE_PASS"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS/zipalign -v -p 4 app-release-unsigned.apk Brilliant-Academy-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass "pass:$EFFECTIVE_PASS" --ks-key-alias brilliant --key-pass "pass:$EFFECTIVE_PASS" --out Brilliant-Academy.apk Brilliant-Academy-aligned.apk
          cp Brilliant-Academy.apk ../../../../../../../public/Brilliant-Academy.apk

      - name: Commit and Push APK to Website
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/Brilliant-Academy.apk
          git commit -m "chore: upload latest release APK to website for download [skip ci]" || echo "No changes"
          git push || echo "Push skipped"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brilliant-Academy-App
          path: public/Brilliant-Academy.apk
          retention-days: 30
