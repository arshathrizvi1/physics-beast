<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Connection Lost</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f5;
            overflow: hidden;
        }
        
        /* The Mock Homepage Background (Blurred) */
        .mock-app-background {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            filter: blur(14px) opacity(0.85);
            z-index: 1;
            display: flex;
            flex-direction: column;
            transform: scale(1.1); /* Hide blur edges */
        }
        
        /* Simulates your Brilliant Academy gold/black header */
        .mock-header {
            height: 85px;
            background: linear-gradient(90deg, #1a1614 0%, #302611 40%, #b08933 100%);
            display: flex; align-items: flex-end; padding: 0 20px 15px 20px;
        }
        .mock-logo { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.25); }
        .mock-btn { width: 90px; height: 35px; border-radius: 20px; background: rgba(255,255,255,0.2); margin-left: auto; margin-bottom: 5px; }
        
        .mock-body { padding: 30px 20px; display: flex; flex-direction: column; gap: 20px; }
        .mock-title { width: 60%; height: 35px; background: #e2e8f0; border-radius: 8px; margin: 0 auto; }
        .mock-card { width: 100%; height: 140px; background: white; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .mock-card-2 { width: 100%; height: 90px; background: white; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* The Liquid Glass Box Overlay */
        .glass-overlay-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25); /* Focus the attention on the glass box */
        }
        
        /* Liquid Glassmorphism Effect */
        .liquid-glass-box {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.3);
            border-radius: 32px;
            padding: 40px 25px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            color: #1f2937;
        }
        
        .icon-wrapper {
            width: 85px; height: 85px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.3));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,1);
        }
        
        .icon { width: 45px; height: 45px; color: #b08933; } /* Brilliant Academy Gold */
        
        h1 { margin: 0 0 10px 0; font-size: 1.7rem; font-weight: 800; color: #111827; }
        p { margin: 0 0 25px 0; font-size: 1rem; color: #4b5563; line-height: 1.5; font-weight: 600; }
        
        button {
            background: linear-gradient(90deg, #b08933 0%, #d4af37 100%);
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 18px;
            font-size: 1.15rem;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 8px 20px rgba(176, 137, 51, 0.3);
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <!-- Simulated App Background (Blurred) -->
    <div class="mock-app-background">
        <div class="mock-header">
            <div class="mock-logo"></div>
            <div class="mock-btn"></div>
        </div>
        <div class="mock-body">
            <div class="mock-title"></div>
            <div class="mock-card"></div>
            <div class="mock-card-2"></div>
            <div class="mock-card"></div>
        </div>
    </div>

    <!-- Liquid Glass Box Overlay -->
    <div class="glass-overlay-container">
        <div class="liquid-glass-box">
            <div class="icon-wrapper">
                <!-- Wifi Off SVG -->
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M18.364 5.636a9 9 0 011.026 11.536M15.536 8.464a5 5 0 011.025 5.882M12 12l-3-3m0 0l-3-3m3 3l3 3m0 0l3 3m-3-3l-3 3"></path>
                </svg>
            </div>
            <h1>No Connection</h1>
            <p>We can't connect to Brilliant Academy. Please check your internet.</p>
            <button onclick="retryConnection()">Reconnect</button>
        </div>
    </div>

    <script>
        function retryConnection() {
            window.location.href = 'https://brilliantacademy.vercel.app';
        }
        setInterval(() => {
            if (navigator.onLine) {
                retryConnection();
            }
        }, 3000);
    </script>
</body>
</html>
