<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connecting...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #070707;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            border-top-color: #d4af37;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; font-size: 20px; font-weight: 600; }
        p { margin: 0; color: #a1a1aa; font-size: 14px; max-width: 80%; }
        .btn {
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2 id="status">Reconnecting...</h2>
    <p>Please check your internet connection.</p>
    <button class="btn" onclick="retry()">Retry Now</button>

    <script>
        function retry() {
            document.getElementById('status').innerText = 'Loading...';
            // Wait a brief moment then redirect back to the live app
            setTimeout(() => {
                window.location.href = "https://brilliantacademy.vercel.app";
            }, 500);
        }

        // Automatically retry after 3 seconds
        setTimeout(retry, 3000);
        
        // Listen for when device comes back online to retry immediately
        window.addEventListener('online', retry);
    </script>
</body>
</html>
