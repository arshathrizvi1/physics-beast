<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reconnecting...</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #070707;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            border-top-color: #d4af37;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin: 0 0 8px 0; font-size: 18px; font-weight: 600; }
        p { margin: 0; color: #71717a; font-size: 13px; max-width: 80%; }
        .btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #d4af37 0%, #b5952f 100%);
            color: #000;
            border: none;
            border-radius: 24px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="spinner" id="loader"></div>
    <h2 id="status">Reconnecting...</h2>
    <p>Please check your internet connection.</p>
    <button class="btn" onclick="retry()">Retry Now</button>

    <script>
        var targetUrl = "https://brilliantacademy.vercel.app";
        var attempts = 0;

        function retry() {
            attempts++;
            document.getElementById('status').innerText = 'Reconnecting...';
            document.getElementById('loader').style.display = 'block';

            var controller = new AbortController();
            var timeoutId = setTimeout(function() { controller.abort(); }, 8000);

            fetch(targetUrl, { method: 'HEAD', mode: 'no-cors', signal: controller.signal })
                .then(function() {
                    clearTimeout(timeoutId);
                    window.location.replace(targetUrl);
                })
                .catch(function() {
                    clearTimeout(timeoutId);
                    document.getElementById('status').innerText = 'Still offline...';
                    // Retry again in 5 seconds
                    if (attempts < 10) {
                        setTimeout(retry, 5000);
                    } else {
                        document.getElementById('status').innerText = 'Connection Failed';
                        document.getElementById('loader').style.display = 'none';
                    }
                });
        }

        // Start auto-retry after 4 seconds (give the network time to settle)
        setTimeout(retry, 4000);
        window.addEventListener('online', function() { attempts = 0; retry(); });
    </script>
</body>
</html>
