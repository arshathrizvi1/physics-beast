<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brilliant Academy</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #070707;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #d4af37 0%, #b5952f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            font-size: 36px;
            font-weight: 900;
            color: #000;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.3);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            border-top-color: #d4af37;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin: 0 0 8px 0; font-size: 18px; font-weight: 600; }
        p { margin: 0; color: #71717a; font-size: 13px; }
        #error-container { display: none; margin-top: 16px; }
        .btn {
            margin-top: 16px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #d4af37 0%, #b5952f 100%);
            color: #000;
            border: none;
            border-radius: 24px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="logo">BA</div>
    <div class="spinner" id="loader"></div>
    <h2 id="status">Loading...</h2>
    <p id="subtitle">Connecting to Brilliant Academy</p>

    <div id="error-container">
        <p>Check your internet connection and try again.</p>
        <button class="btn" onclick="checkConnection()">Retry</button>
    </div>

    <script>
        var targetUrl = "https://brilliantacademy.vercel.app";
        var attempts = 0;
        var maxAutoRetries = 5;

        function checkConnection() {
            attempts++;
            document.getElementById('status').innerText = 'Connecting...';
            document.getElementById('subtitle').innerText = 'Attempt ' + attempts;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('error-container').style.display = 'none';

            var controller = new AbortController();
            var timeoutId = setTimeout(function() { controller.abort(); }, 8000);

            fetch(targetUrl, { method: 'HEAD', mode: 'no-cors', signal: controller.signal })
                .then(function() {
                    clearTimeout(timeoutId);
                    window.location.replace(targetUrl);
                })
                .catch(function() {
                    clearTimeout(timeoutId);
                    if (attempts < maxAutoRetries) {
                        // Auto-retry with backoff
                        var delay = Math.min(1000 * attempts, 4000);
                        document.getElementById('status').innerText = 'Retrying...';
                        document.getElementById('subtitle').innerText = 'Retry in ' + Math.ceil(delay/1000) + 's';
                        setTimeout(checkConnection, delay);
                    } else {
                        // Show manual retry button
                        document.getElementById('status').innerText = 'Connection Failed';
                        document.getElementById('subtitle').innerText = '';
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('error-container').style.display = 'block';
                    }
                });
        }

        setTimeout(checkConnection, 200);
        window.addEventListener('online', function() { attempts = 0; checkConnection(); });
    </script>
</body>
</html>
