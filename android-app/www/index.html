<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brilliant Academy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #070707;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            border-top-color: #d4af37;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; font-size: 20px; font-weight: 600; }
        p { margin: 0; color: #a1a1aa; font-size: 14px; max-width: 80%; }
        
        #error-container {
            display: none;
            margin-top: 20px;
        }
        .btn {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="spinner" id="loader"></div>
    <h2 id="status">Starting App...</h2>
    
    <div id="error-container">
        <p>Please check your internet connection.</p>
        <button class="btn" onclick="checkConnection()">Retry Now</button>
    </div>

    <script>
        const targetUrl = "https://brilliantacademy.vercel.app";

        function checkConnection() {
            document.getElementById('status').innerText = 'Connecting...';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('error-container').style.display = 'none';

            // We ping the target URL to see if it's reachable.
            fetch(targetUrl, { method: 'HEAD', mode: 'no-cors' })
                .then(() => {
                    // Success! Redirect to the live site.
                    // Using replace so the back button doesn't trap them here.
                    window.location.replace(targetUrl);
                })
                .catch(() => {
                    // Offline or unreachable
                    document.getElementById('status').innerText = 'Connection Failed';
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('error-container').style.display = 'block';
                });
        }

        // Start checking on boot
        setTimeout(checkConnection, 100);
        
        // Listen for when device comes back online to retry immediately
        window.addEventListener('online', checkConnection);
    </script>
</body>
</html>
