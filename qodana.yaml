version: "1.0"
linter: qodana-js
profile:
  name: qodana.recommended
licenseRules:
  - allowed:
      - Apache-2.0
      - MIT
      - BSD-2-Clause
      - BSD-3-Clause
      - ISC
      - 0BSD
      - CC0-1.0
      - Unlicense
      - UNLICENSED
      - Python-2.0
      - WTFPL
      - Zlib
      - BlueOak-1.0.0
exclude:
  - name: All
    paths:
      - .next
      - public
      - android
      - android-app
      - brilliant_academy_flutter
failureConditions:
  severityThresholds:
    critical: 0
    high: 0
