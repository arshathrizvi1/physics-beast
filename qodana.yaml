version: "1.0"
linter: qodana-js
profile:
  name: qodana.recommended

licenseRules:
  - keys:
      - "PROPRIETARY-LICENSE"
      - "UNLICENSED"
    allowed:
      - "MIT"
      - "Apache-2.0"
      - "ISC"
      - "BSD-2-Clause"
      - "BSD-3-Clause"
      - "0BSD"
      - "CC0-1.0"
      - "CC-BY-3.0"
      - "CC-BY-4.0"
      - "BlueOak-1.0.0"
      - "Python-2.0"
      - "MPL-2.0"
      - "Unlicense"
      - "WTFPL"
      - "Zlib"
      - "MIT-0"
      - "LGPL-3.0-or-later"
    prohibited:
      - "AGPL-3.0-only"
      - "AGPL-3.0-or-later"
      - "GPL-3.0-only"
      - "GPL-3.0-or-later"

exclude:
  - name: All
    paths:
      - .next
      - out
      - public
      - android
      - android-app
      - brilliant_academy_flutter
      - rtmp-server
      - whatsapp-otp-bot
      - legacy-scripts
      - scripts
      - tests
      - coverage
      - local-mocks
  - name: JsCoverageInspection
    paths:
      - next.config.js
      - postcss.config.js
      - tailwind.config.js
  - name: JSXUnresolvedComponent
  - name: ES6PreferShortImport
    paths:
      - functions
  - name: VulnerableLibrariesLocal

include:
  - name: CheckDependencyLicenses
  - name: NpmUsedModulesInstalled
  - name: PackageJsonMismatchedDependency
