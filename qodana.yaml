version: "1.0"
linter: qodana-js
bootstrap: test -d node_modules || npm ci
profile:
  name: qodana.recommended

licenseRules:
  - keys:
      - "PROPRIETARY-LICENSE"
      - "UNLICENSED"
    allowed:
      - "MIT"
      - "Apache-2.0"
      - "ISC"
      - "BSD-2-Clause"
      - "BSD-3-Clause"
      - "0BSD"
      - "CC0-1.0"
      - "CC-BY-3.0"
      - "CC-BY-4.0"
      - "BlueOak-1.0.0"
      - "Python-2.0"
      - "MPL-2.0"
      - "Unlicense"
      - "WTFPL"
      - "Zlib"
      - "MIT-0"
      - "LGPL-3.0-or-later"
    prohibited:
      - "AGPL-3.0-only"
      - "AGPL-3.0-or-later"
      - "GPL-3.0-only"
      - "GPL-3.0-or-later"

exclude:
  - name: All
    paths:
      - .next
      - out
      - public
      - android
      - android-app
      - brilliant_academy_flutter
      - rtmp-server
      - whatsapp-otp-bot
      - legacy-scripts
      - scripts
      - tests
      - coverage
      - local-mocks
  - name: JsCoverageInspection
    paths:
      - next.config.js
      - postcss.config.js
      - tailwind.config.js
  - name: JSXUnresolvedComponent
  - name: ES6PreferShortImport
    paths:
      - functions
  - name: HardcodedPasswords
    paths:
      - src/lib/firebase.ts
      - src/lib/firebase.js
      - src/lib/firebaseAdmin.ts
      - src/lib/firebase-admin.ts
  - name: VulnerableLibrariesLocal

include:
  - name: CheckDependencyLicenses
  - name: NpmUsedModulesInstalled
  - name: PackageJsonMismatchedDependency
  - name: HttpRequestPlaceholder
  - name: BreakStatementWithLabelJS
  - name: ContinueStatementWithLabelJS
  - name: DebuggerStatementJS
  - name: DefaultNotLastCaseInSwitchJS
  - name: ForLoopReplaceableByWhileJS
  - name: ForLoopThatDoesntUseLoopVariableJS
  - name: IfStatementWithIdenticalBranchesJS
  - name: JSMissingSwitchBranches
  - name: JSRedundantSwitchStatement
  - name: ES6ConvertVarToLetConst
  - name: SqlAddNotNullColumnInspection
