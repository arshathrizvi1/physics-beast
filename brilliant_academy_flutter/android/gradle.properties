# --- Memory tuning for an 8 GB RAM machine ---
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g -XX:+UseSerialGC
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon.idletimeout=1800000

android.useAndroidX=true
kotlin.version=2.3.20
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=DEPRECATED_DSL,UNSUPPORTED_PROJECT_OPTION_USE

