name: brilliant_academy_app
description: "Brilliant Academy - High Performance Native Student Learning Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.1

  # State Management & DI
  provider: ^6.1.2

  # Security & DRM Protection (7 Standards)
  flutter_windowmanager: ^0.2.0
  flutter_jailbreak_detection: ^1.10.0
  device_info_plus: ^11.3.0

  # High Performance Video Playback
  video_player: ^2.9.2
  chewie: ^1.8.5

  # UI, Fonts & Animations
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  crypto: ^3.0.6
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
