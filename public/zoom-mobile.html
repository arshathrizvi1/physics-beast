<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Class</title>
    
    <!-- Blind Zoom from detecting Capacitor/Android -->
    <script>
        try {
            var fakeUA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
            Object.defineProperty(navigator, 'userAgent', { get: function() { return fakeUA; }, configurable: true });
            Object.defineProperty(navigator, 'platform', { get: function() { return 'Win32'; }, configurable: true });
            Object.defineProperty(navigator, 'maxTouchPoints', { get: function() { return 0; }, configurable: true });
            Object.defineProperty(window, 'Capacitor', { get: function() { return undefined; }, configurable: true });
            Object.defineProperty(window, 'cordova', { get: function() { return undefined; }, configurable: true });
            Object.defineProperty(window, 'android', { get: function() { return undefined; }, configurable: true });
            var origGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(t, a) {
                var ctx = origGetContext.call(this, t, a);
                if (ctx && (t === 'webgl' || t === 'webgl2')) {
                    var origGet = ctx.getParameter;
                    ctx.getParameter = function(p) {
                        if (p === 37445) return 'Google Inc. (NVIDIA)';
                        if (p === 37446) return 'ANGLE (NVIDIA, NVIDIA GeForce RTX 3080 Direct3D11 vs_5_0 ps_5_0, D3D11)';
                        return origGet.call(this, p);
                    };
                }
                return ctx;
            };
        } catch(e) {}
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #0f0f0f; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        #overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #0f0f0f; z-index: 9999; transition: opacity 0.3s;
        }
        .spinner {
            width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.08);
            border-left-color: #0b5cff; border-radius: 50%;
            animation: spin 0.9s linear infinite; margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status-msg { font-size: 16px; font-weight: 600; color: #e0e0e0; text-align: center; padding: 0 20px; }

        /* Preview card */
        .preview-card {
            width: calc(100% - 48px); max-width: 420px; background: #1c1c1e;
            border-radius: 20px; padding: 40px 24px 32px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.07); margin-bottom: 24px;
        }
        .avatar {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #0b5cff, #6366f1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700; margin-bottom: 18px;
            box-shadow: 0 8px 24px rgba(11,92,255,0.4);
        }
        #preview-name { font-size: 22px; font-weight: 700; color: #fff; text-align: center; }
        .live-badge {
            display: flex; align-items: center; gap: 6px;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 999px; padding: 6px 14px; margin-top: 16px;
            font-size: 12px; font-weight: 700; color: #f87171;
        }
        .live-dot { width: 7px; height: 7px; background: #ef4444; border-radius: 50%; animation: pulse 1.4s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        #join-btn {
            width: calc(100% - 48px); max-width: 420px; padding: 17px;
            background: #0b5cff; color: #fff; border: none; border-radius: 14px;
            font-size: 17px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 24px rgba(11,92,255,0.45);
        }
        #join-btn:disabled { background: #2a2a2a; color: #555; box-shadow: none; }
        .terms { font-size: 11px; color: #444; margin-top: 16px; }

        /* Zoom renders directly into body — no interference */
        .rename-btn, [aria-label="Rename"] { display: none !important; }
    </style>
</head>
<body>

<!-- Single overlay that covers everything until Zoom is ready -->
<div id="overlay">
    <div class="spinner" id="spinner"></div>
    <div id="status-msg">Connecting...</div>
</div>

<!-- Preview UI (shown inside overlay once ready) -->
<div id="preview-ui" style="display:none; flex-direction:column; align-items:center; width:100%; padding: 28px 0;">
    <div class="preview-card">
        <div class="avatar" id="avatar-letter">S</div>
        <div id="preview-name">Student</div>
        <div class="live-badge"><div class="live-dot"></div> LIVE NOW</div>
    </div>
    <button id="join-btn">Join Now</button>
    <div class="terms">By joining you agree to our Terms of Service</div>
</div>

<!-- CLIENT VIEW CSS (Zoom injects its own root into body) -->
<link rel="stylesheet" href="https://source.zoom.us/3.8.0/css/bootstrap.css">
<link rel="stylesheet" href="https://source.zoom.us/3.8.0/css/react-select.css">

<script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
<script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
<script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
<script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
<script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
<script src="https://source.zoom.us/zoom-meeting-3.8.0.min.js"></script>

<script>
    var cfg = {};
    var joining = false;

    function showPreview() {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status-msg').style.display = 'none';
        document.getElementById('preview-ui').style.display = 'flex';
    }

    function showStatus(msg) {
        document.getElementById('spinner').style.display = 'block';
        document.getElementById('status-msg').style.display = 'block';
        document.getElementById('status-msg').innerText = msg;
        document.getElementById('preview-ui').style.display = 'none';
    }

    function hideOverlay() {
        document.getElementById('overlay').style.opacity = '0';
        document.getElementById('overlay').style.pointerEvents = 'none';
    }

    function showError(msg) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status-msg').innerText = msg;
        document.getElementById('status-msg').style.display = 'block';
        document.getElementById('overlay').style.opacity = '1';
        document.getElementById('overlay').style.pointerEvents = 'auto';
        joining = false;
        document.getElementById('join-btn').innerText = 'Retry Join';
        document.getElementById('join-btn').disabled = false;
        showPreview();
    }

    function doJoin() {
        showStatus('Starting Zoom...');

        // Hide overlay so Zoom can render freely into the body underneath
        // Wait 500ms so ZoomMtg has time to inject #zmmtg-root into body
        ZoomMtg.init({
            leaveUrl: window.location.href,
            showMeetingHeader: false,
            disablePreview: true,
            videoDrag: false,
            sharingMode: 'none',
            success: function() {
                showStatus('Joining meeting...');
                ZoomMtg.join({
                    sdkKey: cfg.sdkKey,
                    signature: cfg.signature,
                    meetingNumber: cfg.meetingNumber,
                    password: cfg.password || '',
                    userName: cfg.userName,
                    userEmail: cfg.userEmail || '',
                    success: function() {
                        // Zoom joined — remove overlay so Zoom UI is fully visible
                        hideOverlay();
                    },
                    error: function(err) {
                        showError('Join error: ' + JSON.stringify(err));
                    }
                });
            },
            error: function(err) {
                showError('Init error: ' + JSON.stringify(err));
            }
        });
    }

    function init() {
        var params = new URLSearchParams(window.location.search);
        cfg.meetingNumber = params.get('mn') || '';
        cfg.userName      = params.get('name') || 'Student';
        cfg.userEmail     = params.get('email') || '';
        cfg.password      = params.get('pwd') || '';
        cfg.role          = parseInt(params.get('role') || '0', 10);

        if (!cfg.meetingNumber) {
            showError('Missing meeting number');
            return;
        }

        document.getElementById('preview-name').innerText = cfg.userName;
        document.getElementById('avatar-letter').innerText = cfg.userName.charAt(0).toUpperCase();

        // Start preloading WASM early
        if (typeof ZoomMtg !== 'undefined') {
            ZoomMtg.preLoadWasm();
            ZoomMtg.prepareWebSDK();
        }

        showStatus('Fetching session...');

        fetch('/api/zoom/signature', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ meetingNumber: cfg.meetingNumber, role: cfg.role })
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (!d.signature) throw new Error('No signature in response');
            cfg.signature = d.signature;
            cfg.sdkKey    = d.sdkKey;
            showPreview();
        })
        .catch(function(e) {
            showError('Error: ' + e.message);
        });
    }

    document.getElementById('join-btn').addEventListener('click', function() {
        if (joining) return;
        joining = true;
        this.innerText = 'Joining...';
        this.disabled = true;

        // Request fullscreen
        var el = document.documentElement;
        var fs = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fs) { try { fs.call(el); } catch(e) {} }

        doJoin();
    });

    // Anti-Rename sweep
    setInterval(function() {
        document.querySelectorAll('li, span, a, button').forEach(function(el) {
            if (el.textContent && el.textContent.trim() === 'Rename') {
                el.style.display = 'none';
            }
        });
    }, 600);

    window.addEventListener('load', init);
</script>
</body>
</html>
