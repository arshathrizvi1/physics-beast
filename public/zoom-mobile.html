<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Mobile Web Player</title>
    <script>
        try {
            const fakeUserAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
            Object.defineProperty(navigator, 'userAgent', { get: () => fakeUserAgent, configurable: true });
            Object.defineProperty(navigator, 'platform', { get: () => 'Win32', configurable: true });
            Object.defineProperty(navigator, 'maxTouchPoints', { get: () => 0, configurable: true });
            if (navigator.userAgentData) {
                Object.defineProperty(navigator, 'userAgentData', {
                    get: () => ({ brands: [{brand: "Google Chrome", version: "120"}], mobile: false, platform: "Windows" }),
                    configurable: true
                });
            }
            window.ontouchstart = undefined;
            window.TouchEvent = undefined;
            const spoofWebGL = (context) => {
                if (context && context.prototype && context.prototype.getParameter) {
                    const originalGetParameter = context.prototype.getParameter;
                    context.prototype.getParameter = function(parameter) {
                        if (parameter === 37445) return 'Google Inc. (NVIDIA)';
                        if (parameter === 37446) return 'ANGLE (NVIDIA, NVIDIA GeForce RTX 3080 Direct3D11 vs_5_0 ps_5_0, D3D11)';
                        return originalGetParameter.apply(this, arguments);
                    };
                }
            };
            spoofWebGL(window.WebGLRenderingContext);
            spoofWebGL(window.WebGL2RenderingContext);
        } catch (e) {}
    </script>
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.1.6/css/bootstrap.css" />
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.1.6/css/react-select.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
        }
        #zmmtg-root { display: none; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            z-index: 50;
        }
        
        /* RESTRICT ALL UNWANTED FEATURES */
        #wc-header, .meeting-header, .meeting-info-icon__icon-wrap, .invite-btn-container, [aria-label='Meeting Info'] {
            display: none !important;
            visibility: hidden !important;
        }
        [aria-label="Participants"], .zm-btn__participants, .rename-btn {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loading">Connecting securely...</div>

    <script src="https://source.zoom.us/3.1.6/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.1.6/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.1.6/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.1.6/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.1.6/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-3.1.6.min.js"></script>

    <script>
        async function startMeeting() {
            try {
                const params = new URLSearchParams(window.location.search);
                const meetingNumber = params.get('mn');
                const userName = params.get('name') || 'Student';
                const userEmail = params.get('email') || '';
                const password = params.get('pwd') || '';
                const role = parseInt(params.get('role') || '0', 10);

                if (!meetingNumber) throw new Error("Meeting Number missing");

                window.ZoomMtg.setZoomJSLib('https://source.zoom.us/3.1.6/lib', '/av');
                window.ZoomMtg.preLoadWasm();
                window.ZoomMtg.prepareWebSDK();

                // Get signature
                const sigRes = await fetch("/api/zoom/signature", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ meetingNumber, role }),
                });
                const sigData = await sigRes.json();
                if (!sigRes.ok) throw new Error(sigData.error || "Signature failed");

                document.getElementById('loading').style.display = 'none';
                document.getElementById('zmmtg-root').style.display = 'block';

                window.ZoomMtg.init({
                    leaveUrl: window.location.origin + '/zoom-ended.html',
                    disableInvite: true,
                    disableCallOut: true,
                    disableRecord: true,
                    showMeetingHeader: false,
                    meetingInfo: [], 
                    success: function () {
                        window.ZoomMtg.join({
                            sdkKey: sigData.sdkKey,
                            signature: sigData.signature,
                            meetingNumber: meetingNumber,
                            passWord: password,
                            userName: userName,
                            userEmail: userEmail,
                            success: function (res) {
                                console.log("Joined");
                            },
                            error: function (res) {
                                console.error('Join error', res);
                                document.getElementById('loading').style.display = 'block';
                                document.getElementById('loading').innerText = "Join Error: " + (res.reason || "Unknown");
                            }
                        });
                    },
                    error: function (res) {
                        console.error('Init error', res);
                    }
                });
                
            } catch (err) {
                console.error("Zoom Error:", err);
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = "Error connecting: " + err.message;
            }
        }

        window.addEventListener('load', startMeeting);
    </script>
</body>
</html>
