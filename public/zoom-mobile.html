<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Mobile PC-Engine Player</title>
    
    <!-- ULTIMATE 4003 BROWSER RESTRICTION SPOOFER -->
    <!-- Zoom Web SDK Client View explicitly scans the window object for Capacitor, Cordova, and Android to block WebView wrappers. We must completely blind it. -->
    <script>
        try {
            var fakeUA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
            Object.defineProperty(navigator, 'userAgent', { get: function() { return fakeUA; }, configurable: true });
            Object.defineProperty(navigator, 'platform', { get: function() { return 'Win32'; }, configurable: true });
            Object.defineProperty(navigator, 'maxTouchPoints', { get: function() { return 0; }, configurable: true });
            Object.defineProperty(window, 'ontouchstart', { get: function() { return undefined; }, configurable: true });
            
            // BLIND ZOOM FROM DETECTING CAPACITOR/ANDROID
            Object.defineProperty(window, 'Capacitor', { get: function() { return undefined; }, configurable: true });
            Object.defineProperty(window, 'cordova', { get: function() { return undefined; }, configurable: true });
            Object.defineProperty(window, 'android', { get: function() { return undefined; }, configurable: true });
            Object.defineProperty(window, 'Android', { get: function() { return undefined; }, configurable: true });
            
            // TRAP PARENT TRAVERSAL
            Object.defineProperty(window, 'parent', { get: function() { return window; }, configurable: true });
            Object.defineProperty(window, 'top', { get: function() { return window; }, configurable: true });

            // FAKE DESKTOP GPU
            var originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, attrs) {
                var ctx = originalGetContext.call(this, type, attrs);
                if (ctx && (type === 'webgl' || type === 'webgl2')) {
                    var originalGetParameter = ctx.getParameter;
                    ctx.getParameter = function(pName) {
                        if (pName === 37445) return 'Google Inc. (NVIDIA)';
                        if (pName === 37446) return 'ANGLE (NVIDIA, NVIDIA GeForce RTX 3080 Direct3D11 vs_5_0 ps_5_0, D3D11)';
                        return originalGetParameter.call(this, pName);
                    };
                }
                return ctx;
            };
        } catch(e) {}
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
        #zmmtg-root { display: none; } /* Client view handles its own root */
        
        #loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; background: #1a1a1a; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #0b5cff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        #loading-desc { font-size: 14px; color: #aaa; max-width: 80%; text-align: center; line-height: 1.5; }
        
        #preview-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #f5f5f5; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        #preview-box { width: 100%; max-width: 600px; background-color: #242424; border-radius: 12px; padding: 50px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); margin-bottom: 20px; }
        #preview-name { color: white; font-size: 26px; font-weight: 500; text-align: center; word-break: break-all; }
        #join-btn { background-color: #0b5cff; color: white; border: none; border-radius: 8px; padding: 14px 0; width: 100%; max-width: 350px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(11,92,255,0.4); }
        #join-btn:disabled { background-color: #666; cursor: not-allowed; opacity: 0.7; }
        
        /* SAFE ANTI-RENAME FOR CLIENT VIEW */
        .rename-btn, [aria-label="Rename"], .rename-menu-item { display: none !important; opacity: 0 !important; pointer-events: none !important; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-title">Connecting to PC Engine...</div>
        <div id="loading-desc"></div>
    </div>
    
    <div id="preview-screen" style="display: none;">
        <div id="preview-box">
            <div id="preview-name">Loading...</div>
            <div style="color: #999; font-size: 14px; margin-top: 10px;">Tap Join to enter meeting</div>
        </div>
        <button id="join-btn">Join Class</button>
    </div>

    <!-- CLIENT VIEW STYLES -->
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.8.0/css/bootstrap.css" />
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.8.0/css/react-select.css" />

    <!-- CLIENT VIEW SCRIPTS -->
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-3.8.0.min.js"></script>

    <script>
        var meetingConfig = {};
        var joinAttempted = false;

        ZoomMtg.preLoadWasm();
        ZoomMtg.prepareWebSDK();

        function doJoin() {
            ZoomMtg.init({
                leaveUrl: '/zoom-ended.html',
                showMeetingHeader: false,
                disablePreview: true,
                success: function() {
                    ZoomMtg.join({
                        sdkKey: meetingConfig.sdkKey,
                        signature: meetingConfig.signature,
                        meetingNumber: meetingConfig.meetingNumber,
                        password: meetingConfig.password,
                        userName: meetingConfig.userName,
                        userEmail: meetingConfig.userEmail,
                        success: function(res) {
                            sessionStorage.setItem('hasJoinedClass_' + meetingConfig.meetingNumber, 'true');
                            document.getElementById('preview-screen').style.display = 'none';
                            document.getElementById('loading').style.display = 'none';
                        },
                        error: function(err) {
                            var reason = (err.reason || err.message || "").toLowerCase();
                            if (reason.indexOf("duplicate") !== -1 || reason.indexOf("already") !== -1) {
                                sessionStorage.setItem('hasJoinedClass_' + meetingConfig.meetingNumber, 'true');
                                document.getElementById('preview-screen').style.display = 'none';
                                document.getElementById('loading').style.display = 'none';
                            } else {
                                sessionStorage.removeItem('hasJoinedClass_' + meetingConfig.meetingNumber);
                                joinAttempted = false;
                                document.getElementById('join-btn').innerText = "Retry Join";
                                document.getElementById('join-btn').disabled = false;
                                document.getElementById('preview-screen').style.display = 'flex';
                                document.getElementById('loading').style.display = 'none';
                                alert("Join Error: " + JSON.stringify(err));
                            }
                        }
                    });
                },
                error: function(res) {
                    console.error("Init Error", res);
                }
            });
        }

        function initPreview() {
            var params = new URLSearchParams(window.location.search);
            meetingConfig.meetingNumber = params.get('mn');
            meetingConfig.userName = params.get('name') || 'Student';
            meetingConfig.userEmail = params.get('email') || '';
            meetingConfig.password = params.get('pwd') || '';
            meetingConfig.role = parseInt(params.get('role') || '0', 10);

            if (!meetingConfig.meetingNumber) {
                document.getElementById('loading-title').innerText = "Meeting Number missing";
                return;
            }

            document.getElementById('preview-name').innerText = meetingConfig.userName;

            fetch("/api/zoom/signature", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ meetingNumber: meetingConfig.meetingNumber, role: meetingConfig.role })
            })
            .then(function(res) { return res.json(); })
            .then(function(sigData) {
                meetingConfig.signature = sigData.signature;
                meetingConfig.sdkKey = sigData.sdkKey;

                if (sessionStorage.getItem('hasJoinedClass_' + meetingConfig.meetingNumber) === 'true') {
                    document.getElementById('loading-title').innerText = "Resuming class...";
                    doJoin();
                } else {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('preview-screen').style.display = 'flex';
                }
            })
            .catch(function(err) {
                document.getElementById('loading-title').innerText = "Init Error: " + (err.message || "Unknown");
            });
        }

        document.getElementById('join-btn').addEventListener('click', function() {
            if (joinAttempted) return;
            joinAttempted = true;
            this.innerText = "Connecting...";
            this.disabled = true;
            doJoin();
        });

        // Safe Anti-Rename logic
        setInterval(function() {
            var dropdowns = document.querySelectorAll('.zm-dropdown-menu-item, li, a, span');
            for(var j = 0; j < dropdowns.length; j++) {
                if (dropdowns[j].textContent && dropdowns[j].textContent.indexOf('Rename') !== -1) {
                    dropdowns[j].style.display = 'none';
                }
            }
        }, 500);

        // Force media decode on screen tap
        document.body.addEventListener('touchstart', function() {
            document.querySelectorAll('video, audio').forEach(function(el) { try{ el.play(); }catch(e){} });
        });
        document.body.addEventListener('click', function() {
            document.querySelectorAll('video, audio').forEach(function(el) { try{ el.play(); }catch(e){} });
        });

        window.addEventListener('load', initPreview);
    </script>
</body>
</html>
