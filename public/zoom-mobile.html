<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Class</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #18181b; color: white; font-family: sans-serif; overflow: hidden; }

        #loading {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #18181b; z-index: 100;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-left-color: #fff;
            border-radius: 50%; width: 32px; height: 32px;
            animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Force Component View root to fill the iframe */
        #zmmtg-root {
            position: fixed; top: 0; left: 0;
            width: 100% !important; height: 100% !important;
            z-index: 1;
        }
        
        /* Force internal Zoom wrappers to fill the screen */
        #zmmtg-root > div, .meeting-client, .meeting-client-inner {
            width: 100% !important;
            height: 100% !important;
        }

        /* Hide rename everywhere */
        .rename-btn, [aria-label="Rename"] { display: none !important; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Connecting to Live Class...</div>
    </div>

    <div id="zmmtg-root"></div>

    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/zoom-meeting-embedded-3.8.0.min.js"></script>

    <script>
        function initZoom() {
            var params = new URLSearchParams(window.location.search);
            var meetingNumber = params.get('mn') || '';
            var userName      = params.get('name') || 'Student';
            var userEmail     = params.get('email') || '';
            var password      = params.get('pwd') || '';
            var role          = parseInt(params.get('role') || '0', 10);

            if (!meetingNumber) {
                document.getElementById('loading').innerHTML = '<p style="color:#f87171">Missing meeting number</p>';
                return;
            }

            fetch('/api/zoom/signature', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ meetingNumber: meetingNumber, role: role })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.signature) throw new Error('No signature returned');

                var client = window.ZoomMtgEmbedded.createClient();
                var root   = document.getElementById('zmmtg-root');

                // Using a very large dimension ensures the internal canvas has enough resolution.
                // Our CSS will scale it down to fit the iframe perfectly.
                var maxDim = 2560;

                client.init({
                    zoomAppRoot: root,
                    language: 'en-US',
                    customize: {
                        video: {
                            isResizable: false,
                            viewSizes: {
                                default: { width: maxDim, height: maxDim },
                                ribbon:  { width: maxDim, height: maxDim }
                            }
                        },
                        meetingInfo: [] // Empty array hides the top green shield and meeting details
                    }
                }).then(function() {
                    return client.join({
                        sdkKey:        data.sdkKey,
                        signature:     data.signature,
                        meetingNumber: meetingNumber,
                        password:      password,
                        userName:      userName,
                        userEmail:     userEmail
                    });
                }).then(function() {
                    document.getElementById('loading').style.display = 'none';

                    client.on('connection-change', function(payload) {
                        if (payload.state === 'Closed') {
                            // On leave, notify parent window to reload or go somewhere
                            window.parent.postMessage('zoom-leave', '*');
                        }
                    });

                    document.body.addEventListener('touchstart', function() {
                        document.querySelectorAll('video, audio').forEach(function(el) {
                            try { el.play(); } catch(e) {}
                        });
                    }, { once: false, passive: true });

                }).catch(function(err) {
                    var msg = err.reason || err.message || JSON.stringify(err);
                    if (msg.toLowerCase().indexOf('duplicate') !== -1) {
                        document.getElementById('loading').style.display = 'none';
                        return;
                    }
                    document.getElementById('loading').innerHTML =
                        '<p style="color:#f87171;text-align:center;padding:20px">Join Error:<br>' + msg + '</p>';
                });
            })
            .catch(function(e) {
                document.getElementById('loading').innerHTML =
                    '<p style="color:#f87171;text-align:center;padding:20px">Error: ' + e.message + '</p>';
            });
        }

        setInterval(function() {
            document.querySelectorAll('li, span, a, button').forEach(function(el) {
                if (el.textContent && el.textContent.trim() === 'Rename') el.style.display = 'none';
            });
        }, 600);

        window.addEventListener('load', initZoom);
    </script>
</body>
</html>
