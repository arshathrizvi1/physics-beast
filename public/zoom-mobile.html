<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Meeting</title>

    <!-- EXACT SAME SPOOFER AS PC VERSION -->
    <script>
        try {
            var fakeUserAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
            Object.defineProperty(navigator, 'userAgent', { get: function() { return fakeUserAgent; }, configurable: true });
            Object.defineProperty(navigator, 'platform', { get: function() { return 'Win32'; }, configurable: true });
            Object.defineProperty(navigator, 'maxTouchPoints', { get: function() { return 0; }, configurable: true });
            if (navigator.userAgentData) {
                Object.defineProperty(navigator, 'userAgentData', {
                    get: function() { return { brands: [{brand:'Google Chrome',version:'120'},{brand:'Chromium',version:'120'}], mobile: false, platform: 'Windows' }; },
                    configurable: true
                });
            }
            window.ontouchstart = undefined;
            window.TouchEvent = undefined;
            Object.defineProperty(window, 'Capacitor', { get: function() { return undefined; }, configurable: true });
            Object.defineProperty(window, 'cordova',   { get: function() { return undefined; }, configurable: true });
            Object.defineProperty(window, 'android',   { get: function() { return undefined; }, configurable: true });
            function spoofWebGL(context) {
                if (context && context.prototype && context.prototype.getParameter) {
                    var orig = context.prototype.getParameter;
                    context.prototype.getParameter = function(p) {
                        if (p === 37445) return 'Google Inc. (NVIDIA)';
                        if (p === 37446) return 'ANGLE (NVIDIA, NVIDIA GeForce RTX 3080 Direct3D11 vs_5_0 ps_5_0, D3D11)';
                        return orig.apply(this, arguments);
                    };
                }
            }
            spoofWebGL(window.WebGLRenderingContext);
            spoofWebGL(window.WebGL2RenderingContext);
        } catch(e) {}
    </script>

    <!-- EXACT SAME CSS AS PC VERSION -->
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.8.0/css/bootstrap.css" />
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.8.0/css/react-select.css" />

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #18181b; color: white;
            font-family: sans-serif; overflow: hidden;
        }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; z-index: 50;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #ffffff; border-radius: 50%;
            width: 32px; height: 32px;
            animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        #zmmtg-root { display: none; }

        /* EXACT SAME ANTI-RENAME CSS AS PC VERSION */
        #wc-header, .meeting-header, .meeting-info-icon__icon-wrap,
        .invite-btn-container, [aria-label='Meeting Info'],
        [aria-label='Participants'], .zm-btn__participants,
        .rename-btn, [aria-label='Rename'] {
            display: none !important; visibility: hidden !important;
            opacity: 0 !important; pointer-events: none !important;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Connecting to Full Zoom Experience...</div>
    </div>

    <!-- EXACT SAME SCRIPTS AS PC VERSION -->
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-3.8.0.min.js"></script>

    <!-- ES5 PROMISE VERSION (no async/await = no Android WebView crash) -->
    <script>
        function initZoom() {
            var params = new URLSearchParams(window.location.search);
            var meetingNumber = params.get('mn');
            var userName      = params.get('name') || 'Student';
            var userEmail     = params.get('email') || '';
            var password      = params.get('pwd') || '';
            var role          = parseInt(params.get('role') || '0', 10);

            if (!meetingNumber) {
                document.getElementById('loading').innerHTML = '<div style="color:#f87171;text-align:center"><h3>Error</h3><p>Meeting Number is missing</p></div>';
                return;
            }

            window.ZoomMtg.setZoomJSLib('https://source.zoom.us/3.8.0/lib', '/av');
            window.ZoomMtg.preLoadWasm();
            window.ZoomMtg.prepareWebSDK();

            fetch('/api/zoom/signature', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ meetingNumber: meetingNumber, role: role })
            })
            .then(function(response) { return response.json().then(function(data) { return { ok: response.ok, data: data }; }); })
            .then(function(result) {
                if (!result.ok) throw new Error(result.data.error || 'Failed to get signature');
                var signature = result.data.signature;
                var sdkKey    = result.data.sdkKey;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('zmmtg-root').style.display = 'block';

                window.ZoomMtg.init({
                    leaveUrl: window.location.origin + '/zoom-ended.html',
                    disableInvite: true,
                    disableCallOut: true,
                    disableRecord: true,
                    showMeetingHeader: false,
                    meetingInfo: [],
                    success: function() {
                        window.ZoomMtg.join({
                            sdkKey: sdkKey,
                            signature: signature,
                            meetingNumber: meetingNumber,
                            passWord: password,
                            userName: userName,
                            userEmail: userEmail,
                            success: function() {
                                console.log('Successfully joined Zoom meeting');
                            },
                            error: function(res) {
                                console.error('Join error', res);
                                alert('Failed to join meeting: ' + JSON.stringify(res));
                            }
                        });
                    },
                    error: function(res) {
                        console.error('Init error', res);
                        alert('Failed to initialize Zoom: ' + JSON.stringify(res));
                    }
                });
            })
            .catch(function(error) {
                console.error('Zoom initialization failed:', error);
                document.getElementById('loading').innerHTML = '<div style="color:#f87171;text-align:center"><h3 style="margin-bottom:8px">Connection Error</h3><p>' + error.message + '</p></div>';
            });
        }

        window.addEventListener('load', initZoom);

        // EXACT SAME ANTI-RENAME SCRIPT AS PC VERSION
        setInterval(function() {
            if (!document.getElementById('anti-rename-style')) {
                var style = document.createElement('style');
                style.id = 'anti-rename-style';
                style.innerHTML = '[aria-label="Participants"], [aria-label*="Rename"], [aria-label="More"], .zm-btn__participants, .rename-btn, .video-more-menu, .zm-btn__more, .participants-wrapper, .zm-layout-viewer-right-content { display: none !important; visibility: hidden !important; pointer-events: none !important; opacity: 0 !important; }';
                document.head.appendChild(style);
            }
            var elements = document.querySelectorAll('#wc-header, .meeting-header, .meeting-info-icon__icon-wrap, .invite-btn-container, [aria-label="Meeting Info"], [aria-label="Participants"], .zm-btn__participants, .rename-btn, [aria-label="Rename"]');
            elements.forEach(function(el) { el.remove(); });
            var dropdowns = document.querySelectorAll('.zm-dropdown-menu-item, li, a, span');
            dropdowns.forEach(function(el) {
                if (el.textContent && el.textContent.includes('Rename')) {
                    el.style.display = 'none';
                    el.remove();
                }
            });
        }, 500);
    </script>
</body>
</html>
