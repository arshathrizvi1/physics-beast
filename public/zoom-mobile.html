<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Mobile Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #18181b; /* Dark Zoom background */
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }
        #zmmtg-root {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            z-index: 50;
        }
    </style>
</head>
<body>
    <div id="loading">Connecting securely...</div>
    <div id="zmmtg-root"></div>

    <!-- REQUIRED REACT DEPENDENCIES FOR COMPONENT VIEW -->
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    
    <!-- COMPONENT VIEW BUNDLE -->
    <script src="https://source.zoom.us/3.8.0/zoom-meeting-embedded-3.8.0.min.js"></script>

    <script>
        let client;
        async function startMeeting() {
            try {
                // Clear any broken zoom states from local storage
                try { sessionStorage.clear(); } catch(e){}

                const params = new URLSearchParams(window.location.search);
                const meetingNumber = params.get('mn');
                const userName = params.get('name') || 'Student';
                const userEmail = params.get('email') || '';
                const password = params.get('pwd') || '';
                const role = parseInt(params.get('role') || '0', 10);

                if (!meetingNumber) throw new Error("Meeting Number missing");

                // Get signature
                const sigRes = await fetch("/api/zoom/signature", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ meetingNumber, role }),
                });
                const sigData = await sigRes.json();
                if (!sigRes.ok) throw new Error(sigData.error || "Signature failed");

                client = window.ZoomMtgEmbedded.createClient();
                const container = document.getElementById('zmmtg-root');
                
                // Use robust window dimensions
                let w = window.innerWidth > 0 ? window.innerWidth : 800;
                let h = window.innerHeight > 0 ? window.innerHeight : 600;

                await client.init({
                    zoomAppRoot: container,
                    language: 'en-US',
                    customize: {
                        video: {
                            isResizable: true,
                            viewSizes: {
                                default: { width: w, height: h },
                                ribbon: { width: w, height: h }
                            }
                        },
                        meetingInfo: {
                            showMeetingId: false,
                            showPasscode: false,
                            showInviteLink: false
                        },
                        toolbar: {
                            buttons: [
                                { text: 'Audio', className: 'Microphone', visible: true },
                                { text: 'Video', className: 'Camera', visible: true },
                                { text: 'Leave', className: 'Leave', visible: true },
                                // Exclude Participants to strictly disable renaming!
                                { text: 'Participants', className: 'Participants', visible: false },
                                { text: 'Chat', className: 'Chat', visible: false },
                                { text: 'Share', className: 'Share', visible: false }
                            ]
                        }
                    }
                });

                document.getElementById('loading').style.display = 'none';

                await client.join({
                    sdkKey: sigData.sdkKey,
                    signature: sigData.signature,
                    meetingNumber: meetingNumber,
                    password: password,
                    userName: userName,
                    userEmail: userEmail
                });

                console.log("Successfully connected!");

                // Handle resize seamlessly
                window.addEventListener('resize', () => {
                    if (client) {
                        try {
                            const newW = window.innerWidth > 0 ? window.innerWidth : 800;
                            const newH = window.innerHeight > 0 ? window.innerHeight : 600;
                            client.updateVideoViewSizes({
                                default: { width: newW, height: newH },
                                ribbon: { width: newW, height: newH }
                            });
                        } catch(e) {}
                    }
                });

                client.on('connection-change', (payload) => {
                    if (payload.state === 'Closed') {
                        window.location.href = '/zoom-ended.html';
                    }
                });

            } catch (err) {
                console.error("Zoom Error:", err);
                if (err && err.reason && err.reason.includes("duplicate join")) {
                    console.log("Ignored duplicate join");
                } else {
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('loading').innerText = "Join Error: " + (err.reason || err.message || "Unknown error");
                }
            }
        }

        window.addEventListener('load', startMeeting);
    </script>
</body>
</html>
