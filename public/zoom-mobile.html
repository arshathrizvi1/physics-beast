    <div id="loading">
        <div class="spinner"></div>

    <script>
        function initZoom() {
            var params = new URLSearchParams(window.location.search);
            var meetingNumber = params.get('mn');
            var userName      = params.get('name') || 'Student';
            var userEmail = params.get('email'); if (!userEmail || userEmail === 'undefined' || userEmail === 'null' || userEmail.trim() === '') { userEmail = 'student@brilliantacademy.com'; }
            var password = params.get('pwd'); if (!password || password === 'undefined' || password === 'null') { password = ''; }
            var role          = parseInt(params.get('role') || '0', 10);

            if (!meetingNumber) {
                document.getElementById('loading').innerHTML = '<div style="color:#f87171;text-align:center"><h3>Error</h3><p>Meeting Number is missing</p></div>';
                return;
            }

            window.ZoomMtg.setZoomJSLib('https://source.zoom.us/3.8.0/lib', '/av');
            window.ZoomMtg.preLoadWasm();
            window.ZoomMtg.prepareWebSDK();

            fetch('/api/zoom/signature', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ meetingNumber: meetingNumber, role: role })
            })
            .then(function(response) { return response.json().then(function(data) { return { ok: response.ok, data: data }; }); })
            .then(function(result) {
                if (!result.ok) throw new Error(result.data.error || 'Failed to get signature');
                var signature = result.data.signature;
                var sdkKey    = result.data.sdkKey;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('zmmtg-root').style.display = 'block';

                window.ZoomMtg.init({
                    leaveUrl: window.location.origin + '/zoom-ended.html',
                    disableInvite: true,
                    disableCallOut: true,
                    disableRecord: true,
                    showMeetingHeader: false,
                    meetingInfo: [],
                    success: function() {
                        window.ZoomMtg.join({
                            sdkKey: sdkKey,
                            signature: signature,
                            meetingNumber: meetingNumber,
                            passWord: password,
                            userName: userName,
                            userEmail: userEmail,
                            success: function() {
                                console.log('Successfully joined Zoom meeting');
                            },
                            error: function(res) {
                                console.error('Join error', res);
                                alert('Failed to join meeting: ' + JSON.stringify(res));
                            }
                        });
                    },
                    error: function(res) {
                        console.error('Init error', res);
                        alert('Failed to initialize Zoom: ' + JSON.stringify(res));
                    }
                });
            })
            .catch(function(error) {
                console.error('Zoom initialization failed:', error);
                document.getElementById('loading').innerHTML = '<div style="color:#f87171;text-align:center"><h3 style="margin-bottom:8px">Connection Error</h3><p>' + error.message + '</p></div>';
            });
        }

        window.addEventListener('load', initZoom);

        setInterval(function() {
            if (!document.getElementById('anti-rename-style')) {
                var style = document.createElement('style');
                style.id = 'anti-rename-style';
                style.innerHTML = '[aria-label="Participants"], [aria-label*="Rename"], [aria-label="More"], .zm-btn__participants, .rename-btn, .video-more-menu, .zm-btn__more, .participants-wrapper {  display: none !important; visibility: hidden !important; pointer-events: none !important; opacity: 0 !important; }';
                document.head.appendChild(style);
            }
            var elements = document.querySelectorAll('.meeting-info-icon__icon-wrap, .invite-btn-container, [aria-label="Meeting Info"], [aria-label="Participants"], .zm-btn__participants, .rename-btn, [aria-label="Rename"]');
            elements.forEach(function(el) { el.remove(); });
            var dropdowns = document.querySelectorAll('.zm-dropdown-menu-item, li, a, span');
            dropdowns.forEach(function(el) {
                if (el.textContent && el.textContent.trim() === 'Rename') {
                    el.style.display = 'none';
                    el.remove();
                }
            });
        }, 500);
    </script>
<script>
    // Custom Toolbar Auto-Hide for Spoofed Mobile Environment
    var toolbarTimeout = null;
    function wakeToolbar() {
        var bars = document.querySelectorAll('.footer, .footer-wrapper, .zm-layout-viewer-bottom, [class*="footer"], .header, .meeting-header, .zm-layout-viewer-header');
        bars.forEach(function(bar) {
            bar.style.opacity = '1';
            bar.style.pointerEvents = 'all';
            bar.style.transition = 'all 0.4s ease';
        });
        clearTimeout(toolbarTimeout);
        toolbarTimeout = setTimeout(hideToolbar, 2000);
    }
    function hideToolbar() {
        var bars = document.querySelectorAll('.footer, .footer-wrapper, .zm-layout-viewer-bottom, [class*="footer"], .header, .meeting-header, .zm-layout-viewer-header');
        bars.forEach(function(bar) {
            bar.style.opacity = '0';
            bar.style.pointerEvents = 'none';
            bar.style.transition = 'all 0.4s ease';
        });
    }
    document.addEventListener('touchstart', wakeToolbar, {passive: true});
    document.addEventListener('mousemove', wakeToolbar, {passive: true});
    document.addEventListener('click', wakeToolbar, {passive: true});
    toolbarTimeout = setTimeout(hideToolbar, 2000);
</script>

        var canvases = Array.from(document.querySelectorAll('canvas')).filter(c => {

            return (current.width * current.height > largest.width * largest.height) ? current : largest;

        }
        
        // 3. For all other canvases (thumbnails/popups), undo any aggressive styles we might have accidentally applied to them previously
        canvases.forEach(function(c) {
            if (c !== mainCanvas) {
                c.style.removeProperty('width');

                c.style.removeProperty('object-fit');
                c.style.removeProperty('transform');
                c.style.removeProperty('position');
                c.style.removeProperty('top');
                c.style.removeProperty('left');
                c.style.setProperty('z-index', '50', 'important');
                
                var cp = c.parentElement;
                if (cp && cp !== mainCanvas.parentElement) {
                    cp.style.removeProperty('width');
                    cp.style.removeProperty('height');
                    cp.style.removeProperty('transform');
                    cp.style.removeProperty('position');
                    cp.style.removeProperty('top');
                    cp.style.removeProperty('left');
                    cp.style.setProperty('z-index', '50', 'important');
                }
            }
        });
