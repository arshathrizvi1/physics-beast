<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Mobile Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #zmmtg-root {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            z-index: 50;
        }
        #preview-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        #preview-box {
            width: 100%;
            max-width: 600px;
            background-color: #242424;
            border-radius: 12px;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        #preview-name {
            color: white;
            font-size: 26px;
            font-weight: 500;
            text-align: center;
            word-break: break-all;
        }
        #preview-desc {
            color: #999;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        #join-btn {
            background-color: #0b5cff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 0;
            width: 100%;
            max-width: 350px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(11,92,255,0.4);
            transition: background-color 0.2s, opacity 0.2s;
        }
        #join-btn:active { background-color: #094dd6; }
        #join-btn:disabled { background-color: #666; cursor: not-allowed; opacity: 0.7; }
        .terms-text {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="loading">Connecting securely...</div>
    
    <div id="preview-screen" style="display: none;">
        <div id="preview-box">
            <div id="preview-name">Loading...</div>
            <div id="preview-desc">Ready to join meeting</div>
        </div>
        <div class="terms-text">By clicking "Join", you agree to our Terms of Service.</div>
        <button id="join-btn">Join</button>
        <div style="color: #666; font-size: 12px; margin-top: 15px;">© 2024 Zoom Video Communications, Inc.</div>
    </div>

    <div id="zmmtg-root"></div>

    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/zoom-meeting-embedded-3.8.0.min.js"></script>

    <script>
        let client;
        let meetingConfig = {};
        let joinAttempted = false;

        async function doJoin() {
            try {
                await client.join({
                    sdkKey: meetingConfig.sdkKey,
                    signature: meetingConfig.signature,
                    meetingNumber: meetingConfig.meetingNumber,
                    password: meetingConfig.password,
                    userName: meetingConfig.userName,
                    userEmail: meetingConfig.userEmail
                });
                
                sessionStorage.setItem('hasJoinedClass_' + meetingConfig.meetingNumber, 'true');
                document.getElementById('preview-screen').style.display = 'none';
                document.getElementById('loading').style.display = 'none';
                
                window.addEventListener('resize', () => {
                    if (client) {
                        try {
                            const newW = window.innerWidth > 0 ? window.innerWidth : 800;
                            const newH = window.innerHeight > 0 ? window.innerHeight : 600;
                            client.updateVideoViewSizes({
                                default: { width: newW, height: newH },
                                ribbon: { width: newW, height: newH }
                            });
                        } catch(e) {}
                    }
                });

                client.on('connection-change', (payload) => {
                    if (payload.state === 'Closed') { 
                        sessionStorage.removeItem('hasJoinedClass_' + meetingConfig.meetingNumber);
                        window.location.href = '/zoom-ended.html'; 
                    }
                });

            } catch (err) {
                const reason = (err.reason || err.message || "").toLowerCase();
                if (reason.includes("duplicate")) {
                    console.log("Ignored duplicate join, resuming session.");
                    sessionStorage.setItem('hasJoinedClass_' + meetingConfig.meetingNumber, 'true');
                    document.getElementById('preview-screen').style.display = 'none';
                    document.getElementById('loading').style.display = 'none';
                } else {
                    sessionStorage.removeItem('hasJoinedClass_' + meetingConfig.meetingNumber);
                    joinAttempted = false;
                    const btn = document.getElementById('join-btn');
                    btn.innerText = "Retry Join";
                    btn.disabled = false;
                    document.getElementById('preview-screen').style.display = 'flex';
                    document.getElementById('loading').style.display = 'none';
                    alert("Join Error: " + (err.reason || err.message || "Unknown error"));
                }
            }
        }

        async function initPreview() {
            try {
                const params = new URLSearchParams(window.location.search);
                meetingConfig.meetingNumber = params.get('mn');
                meetingConfig.userName = params.get('name') || 'Student';
                meetingConfig.userEmail = params.get('email') || '';
                meetingConfig.password = params.get('pwd') || '';
                meetingConfig.role = parseInt(params.get('role') || '0', 10);

                if (!meetingConfig.meetingNumber) throw new Error("Meeting Number missing");

                document.getElementById('preview-name').innerText = meetingConfig.userName;

                const sigRes = await fetch("/api/zoom/signature", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ meetingNumber: meetingConfig.meetingNumber, role: meetingConfig.role }),
                });
                const sigData = await sigRes.json();
                if (!sigRes.ok) throw new Error(sigData.error || "Signature failed");
                meetingConfig.signature = sigData.signature;
                meetingConfig.sdkKey = sigData.sdkKey;

                client = window.ZoomMtgEmbedded.createClient();
                const container = document.getElementById('zmmtg-root');
                
                let w = window.innerWidth > 0 ? window.innerWidth : 800;
                let h = window.innerHeight > 0 ? window.innerHeight : 600;

                await client.init({
                    zoomAppRoot: container,
                    language: 'en-US',
                    customize: {
                        video: {
                            isResizable: true,
                            viewSizes: { default: { width: w, height: h }, ribbon: { width: w, height: h } }
                        },
                        meetingInfo: { showMeetingId: false, showPasscode: false, showInviteLink: false },
                        toolbar: {
                            buttons: [
                                { text: 'Audio', className: 'Microphone', visible: true },
                                { text: 'Video', className: 'Camera', visible: true },
                                { text: 'Leave', className: 'Leave', visible: true },
                                { text: 'Participants', className: 'Participants', visible: false },
                                { text: 'Chat', className: 'Chat', visible: false },
                                { text: 'Share', className: 'Share', visible: false }
                            ]
                        }
                    }
                });

                const cleanup = () => { if(client) { try{ client.leave(); }catch(e){} } };
                window.addEventListener('beforeunload', cleanup);
                window.addEventListener('pagehide', cleanup);
                window.addEventListener('unload', cleanup);

                // Seamless Auto-Join if refreshed
                if (sessionStorage.getItem('hasJoinedClass_' + meetingConfig.meetingNumber) === 'true') {
                    document.getElementById('loading').innerText = "Resuming class...";
                    doJoin();
                } else {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('preview-screen').style.display = 'flex';
                }

            } catch (err) {
                console.error("Init Error:", err);
                document.getElementById('loading').innerText = "Init Error: " + (err.message || "Unknown");
            }
        }

        document.getElementById('join-btn').addEventListener('click', () => {
            if (joinAttempted) return;
            joinAttempted = true;
            
            const btn = document.getElementById('join-btn');
            btn.innerText = "Connecting...";
            btn.disabled = true;
            
            doJoin();
        });

        window.addEventListener('load', initPreview);
    </script>
</body>
</html>
