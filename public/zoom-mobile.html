<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Mobile Player</title>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
        #zmmtg-root { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; background: #1a1a1a; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #0b5cff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        #loading-desc { font-size: 14px; color: #aaa; max-width: 80%; text-align: center; line-height: 1.5; }
        #error-box { display: none; background: #3f1010; border: 1px solid #ff4d4f; padding: 20px; border-radius: 8px; max-width: 80%; text-align: center; margin-top: 20px; }
        
        /* HIDDEN UI FOR PC PARITY */
        #wc-header, .meeting-header, .meeting-info-icon__icon-wrap, .invite-btn-container, [aria-label='Meeting Info'] { display: none !important; visibility: hidden !important; }
        [aria-label="Participants"], .zm-btn__participants, .rename-btn { display: none !important; }
    </style>

    <!-- FAKE PC SIGNATURE (MUST BE VERY CAREFUL NOT TO CRASH OLD WEBVIEWS) -->
    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('loading-title').innerText = "System Crash";
            document.getElementById('loading-desc').innerText = "Error on line " + line + ": " + msg;
            document.getElementById('loading-desc').style.color = "#ff4d4f";
        };

        try {
            var fakeUserAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
            if (Object.defineProperty) {
                Object.defineProperty(navigator, 'userAgent', { get: function() { return fakeUserAgent; }, configurable: true });
                Object.defineProperty(navigator, 'platform', { get: function() { return 'Win32'; }, configurable: true });
            }
        } catch(e) {}
    </script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-title">System Booting...</div>
        <div id="loading-desc">Downloading 10MB Video Engine. Please leave the app open for up to 30 seconds.</div>
        <div id="error-box"></div>
    </div>

    <div id="zmmtg-root"></div>

    <!-- LOAD SCRIPTS SYNCHRONOUSLY SO BROWSER HANDLES IT NATIVELY -->
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/zoom-meeting-3.8.0.min.js"></script>

    <script>
        function showError(msg) {
            var el = document.getElementById('error-box');
            el.style.display = 'block';
            el.innerHTML = '<b style="color:#ff4d4f">Error:</b><br/>' + msg;
            document.getElementById('loading-title').innerText = "Connection Failed";
        }

        async function initApp() {
            try {
                document.getElementById('loading-title').innerText = "Authenticating...";
                document.getElementById('loading-desc').innerText = "Verifying secure class credentials.";

                if (!window.ZoomMtg) {
                    throw new Error("Zoom Video Engine failed to download. Check your internet connection.");
                }

                var params = new URLSearchParams(window.location.search);
                var meetingNumber = params.get('mn');
                var userName = params.get('name') || 'Student';
                var userEmail = params.get('email') || '';
                var password = params.get('pwd') || '';
                var role = parseInt(params.get('role') || '0', 10);

                if (!meetingNumber) throw new Error("Missing Class ID.");

                window.ZoomMtg.setZoomJSLib('https://source.zoom.us/3.8.0/lib', '/av');
                window.ZoomMtg.preLoadWasm();
                window.ZoomMtg.prepareWebSDK();

                var res = await fetch("/api/zoom/signature", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ meetingNumber: meetingNumber, role: role }),
                });
                var sigData = await res.json();
                if (!res.ok) throw new Error(sigData.error || "Signature validation failed.");

                document.getElementById('loading-title').innerText = "Entering Class...";
                document.getElementById('loading-desc').innerText = "Starting video decoder.";

                window.ZoomMtg.init({
                    leaveUrl: window.location.origin + '/zoom-ended.html',
                    disableInvite: true,
                    disableCallOut: true,
                    disableRecord: true,
                    showMeetingHeader: false,
                    meetingInfo: [],
                    success: function () {
                        window.ZoomMtg.join({
                            sdkKey: sigData.sdkKey,
                            signature: sigData.signature,
                            meetingNumber: meetingNumber,
                            passWord: password,
                            userName: userName,
                            userEmail: userEmail,
                            success: function () {
                                document.getElementById('loading').style.display = 'none';
                                document.getElementById('zmmtg-root').style.display = 'block';
                            },
                            error: function (e) {
                                var reason = (e.reason || e.message || "").toLowerCase();
                                if (reason.indexOf("duplicate") !== -1) {
                                    document.getElementById('loading').style.display = 'none';
                                    document.getElementById('zmmtg-root').style.display = 'block';
                                } else {
                                    showError("Join rejected by server: " + JSON.stringify(e));
                                }
                            }
                        });
                    },
                    error: function (e) {
                        showError("Video Engine failed to start: " + JSON.stringify(e));
                    }
                });

            } catch(err) {
                showError(err.message);
            }
        }

        // Fire instantly when scripts are done loading
        initApp();
        
                setInterval(function() {
            if (!document.getElementById('anti-rename-style')) {
                var style = document.createElement('style');
                style.id = 'anti-rename-style';
                style.innerHTML = '[aria-label="Participants"], [aria-label*="Rename"], [aria-label="More"], .zm-btn__participants, .rename-btn, .video-more-menu, .zm-btn__more, .participants-wrapper, .zm-layout-viewer-right-content { display: none !important; visibility: hidden !important; pointer-events: none !important; opacity: 0 !important; }';
                document.head.appendChild(style);
            }
            var els = document.querySelectorAll('#wc-header, .meeting-header, .meeting-info-icon__icon-wrap, .invite-btn-container, [aria-label="Meeting Info"], [aria-label="Participants"], .zm-btn__participants, .rename-btn');
            for(var i = 0; i < els.length; i++) els[i].remove();
            
            var dropdowns = document.querySelectorAll('.zm-dropdown-menu-item, li, a, span');
            for(var j = 0; j < dropdowns.length; j++) {
                if (dropdowns[j].textContent && dropdowns[j].textContent.indexOf('Rename') !== -1) {
                    dropdowns[j].style.display = 'none';
                    dropdowns[j].remove();
                }
            }
        }, 500);
    </script>
</body>
</html>
