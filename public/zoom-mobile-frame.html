<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Mobile Player</title>
    <!-- Component View CSS -->
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: sans-serif;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #zoom-root {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background: #000000;
        }

        /* Minimal CSS to hide specific UI elements without breaking video canvas */
        .zm-component-header, [class*="meeting-header"], [class*="meeting-info"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        /* Make background black but do NOT touch canvas directly */
        .zm-component-video-container {
            background-color: #000000 !important;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Connecting to Zoom Engine...</div>
    </div>
    
    <div id="zoom-root"></div>

    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/zoom-meeting-embedded-3.8.0.min.js"></script>

    <script>
        let isJoining = false;
        async function initZoom() {
            if (isJoining) return;
            isJoining = true;
            try { sessionStorage.clear(); } catch(e) {}
            try {
                const params = new URLSearchParams(window.location.search);
                const meetingNumber = params.get('mn');
                const userName = params.get('name') || 'Student';
                const userEmail = (params.get('email') === 'undefined' ? '' : params.get('email')) || '';
                const password = params.get('pwd') || '';
                const role = parseInt(params.get('role') || '0', 10);

                if (!meetingNumber) {
                    throw new Error("Meeting Number is missing");
                }

                // Get signature from our backend
                const response = await fetch("/api/zoom/signature?t=" + new Date().getTime(), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ meetingNumber: meetingNumber, role: role }),
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Failed to get signature");
                }

                const { signature, sdkKey } = data;
                
                const client = ZoomMtgEmbedded.createClient();
                const zoomRoot = document.getElementById('zoom-root');
                
                const getW = () => Math.max(window.innerWidth || 800, 320);
                const getH = () => Math.max(window.innerHeight || 600, 320);

                client.init({
                    zoomAppRoot: zoomRoot,
                    language: 'en-US',
                    customize: {
                        video: {
                            isResizable: false,
                            viewSizes: {
                                default: { width: getW(), height: getH() },
                                ribbon: { width: getW(), height: getH() }
                            }
                        },
                        chat: { poppable: false },
                        meetingInfo: {
                            showMeetingId: false,
                            showPasscode: false,
                            showInviteLink: false
                        },
                        toolbar: {
                            buttons: [
                                { text: 'Audio', className: 'Microphone', visible: true },
                                { text: 'Video', className: 'Camera', visible: true },
                                { text: 'Share', className: 'Share', visible: false },
                                { text: 'Chat', className: 'Chat', visible: false },
                                { text: 'Participants', className: 'Participants', visible: false },
                                { text: 'Leave', className: 'Leave', visible: true }
                            ]
                        }
                    }
                }).then(() => {
                    document.getElementById('loading').style.display = 'none';
                    client.join({
                        sdkKey: sdkKey,
                        signature: signature,
                        meetingNumber: meetingNumber,
                        password: password,
                        userName: userName,
                        userEmail: userEmail
                    }).then(() => {
                        console.log("Successfully joined via Component View");
                        client.on('connection-change', function(payload) {
                            if (payload.state === 'Closed') { window.location.href = 'https://brilliantacademy.vercel.app/courses'; }
                        });
                    }).catch((error) => {
                        if (error && error.reason && error.reason.includes('duplicate join')) { 
                            console.log('Duplicate join ignored'); 
                        } else { 
                            console.error('Join Error:', error); 
                        }
                    });
                }).catch((error) => {
                    console.error('Init Error:', error);
                });

                // Auto resize dynamically to catch iframe dimension changes
                setInterval(() => {
                    try {
                        client.updateVideoViewSizes({
                            default: { width: getW(), height: getH() },
                            ribbon: { width: getW(), height: getH() }
                        });
                    } catch(e) {}
                }, 2000);
                
                window.addEventListener('resize', () => {
                    try {
                        client.updateVideoViewSizes({
                            default: { width: getW(), height: getH() },
                            ribbon: { width: getW(), height: getH() }
                        });
                    } catch(e) {}
                });

            } catch (error) {
                console.error("Initialization failed:", error);
                document.getElementById('loading').innerHTML = '<div style="color: #f87171;">Connection Error: ' + error.message + '</div>';
            }
        }

        window.addEventListener('load', initZoom);
    </script>
</body>
</html>
