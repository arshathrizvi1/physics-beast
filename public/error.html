<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No Internet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #09090b; /* Very dark zinc */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        /* Background decorative blur to look like the app */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(16, 185, 129, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            padding: 2.5rem 2rem;
            background: rgba(24, 24, 27, 0.7);
            border-radius: 24px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(16, 185, 129, 0.05);
            backdrop-filter: blur(20px);
            max-width: 85%;
            width: 320px;
        }
        .icon-wrapper {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px auto;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .icon {
            width: 36px;
            height: 36px;
            color: #10b981;
        }
        h1 { margin: 0 0 12px 0; font-size: 1.4rem; font-weight: 700; tracking: -0.02em; }
        p { margin: 0 0 24px 0; font-size: 0.95rem; color: #a1a1aa; line-height: 1.5; }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }
        button:active {
            transform: scale(0.96);
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="icon-wrapper">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 011.026 11.536M15.536 8.464a5 5 0 011.025 5.882M12 12l-3-3m0 0l-3-3m3 3l3 3m0 0l3 3m-3-3l-3 3"></path>
            </svg>
        </div>
        <h1>Connection Lost</h1>
        <p>No internet connection or your internet is too slow. Please check your network and try again.</p>
        <button onclick="retryConnection()">Try Again</button>
    </div>
    <script>
        function retryConnection() {
            window.location.href = 'https://brilliantacademy.vercel.app';
        }
        // Auto retry every 3 seconds if connection comes back
        setInterval(() => {
            if (navigator.onLine) {
                retryConnection();
            }
        }, 3000);
    </script>
</body>
</html>
