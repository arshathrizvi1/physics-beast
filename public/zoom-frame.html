<!DOCTYPE html>
<html lang="en">
<head>

    <title>Zoom Meeting</title>

            const spoofWebGL = (context) => {

                    context.prototype.getParameter = function(parameter) {

    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.8.0/css/bootstrap.css" />
    <link type="text/css" rel="stylesheet" href="https://source.zoom.us/3.8.0/css/react-select.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #18181b;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
    
        /* Force hide the Zoom Meeting Header and Info Buttons */
        .meeting-info-icon__icon-wrap, .invite-btn-container, [aria-label='Meeting Info'], [aria-label='Participants'], .zm-btn__participants, .rename-btn, [aria-label='Rename'] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    .wr-ad-banner, .web-client-ad-banner, .zm-websdk-ad-banner, [class*="ad-banner"], .zoom-ad-banner { display: none !important; } </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Connecting to Full Zoom Experience...</div>
    </div>

    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-3.8.0.min.js"></script>

    <script>
        async function initZoom() {
            try {
                const params = new URLSearchParams(window.location.search);
                const meetingNumber = params.get('mn');
                const userName = params.get('name') || 'Student';
                const userEmail = params.get('email') || '';
                const password = params.get('pwd') || '';
                const role = parseInt(params.get('role') || '0', 10);

                if (!meetingNumber) {
                    throw new Error("Meeting Number is missing");
                }

                window.ZoomMtg.setZoomJSLib('https://source.zoom.us/3.8.0/lib', '/av');
                window.ZoomMtg.preLoadWasm();
                window.ZoomMtg.prepareWebSDK();

                const response = await fetch("/api/zoom/signature", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ meetingNumber, role }),
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Failed to get signature");
                }

                const { signature, sdkKey } = data;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('zmmtg-root').style.display = 'block';

                window.ZoomMtg.init({
                    leaveUrl: 'https://brilliantacademy.vercel.app/courses',
                    disableInvite: true,
                    disableCallOut: true,
                    disableRecord: true,
                    showMeetingHeader: false,
                     meetingInfo: [], 
                    success: function () {
                        window.ZoomMtg.join({
                            sdkKey: sdkKey,
                            signature: signature,
                            meetingNumber: meetingNumber,
                            passWord: password,
                            userName: userName,
                            userEmail: userEmail || 'student@brilliantacademy.com',
                            success: function (res) {
                                console.log('Successfully joined Zoom meeting');
                            },
                            error: function (res) {
                                console.error('Join error', res);
                                alert("Failed to join meeting: " + JSON.stringify(res));
                            }
                        });
                    },
                    error: function (res) {
                        console.error('Init error', res);
                        alert("Failed to initialize Zoom: " + JSON.stringify(res));
                    }
                });

            } catch (error) {
                console.error("Zoom initialization failed:", error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #f87171; text-align: center;">
                        <h3 style="margin-bottom: 8px;">Connection Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        window.addEventListener('load', initZoom);
        
                // Brute force DOM destruction of all meeting info UI and Rename buttons
                        setInterval(() => {
            if (!document.getElementById('anti-rename-style')) {
                const style = document.createElement('style');
                style.id = 'anti-rename-style';
                style.innerHTML = '[aria-label="Participants"], [aria-label*="Rename"], [aria-label="More"], .zm-btn__participants, .rename-btn, .video-more-menu, .zm-btn__more, .participants-wrapper {  display: none !important; visibility: hidden !important; pointer-events: none !important; opacity: 0 !important; }';
                document.head.appendChild(style);
            }
            const elements = document.querySelectorAll('.meeting-info-icon__icon-wrap, .invite-btn-container, [aria-label="Meeting Info"], [aria-label="Participants"], .zm-btn__participants, .rename-btn, [aria-label="Rename"]');
            elements.forEach(el => el.remove());
            const dropdowns = document.querySelectorAll('.zm-dropdown-menu-item, li, a, span');
            dropdowns.forEach(el => {
                if (el.textContent && el.textContent.includes('Rename')) {
                    el.style.display = 'none';
                    el.remove();
                }
            });
        }, 500);
    </script>
</body>
</html>
