<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Meeting Component View</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #18181b;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffffff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #meetingSDKElement {
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Connecting to Mobile Zoom Experience...</div>
    </div>

    <div id="meetingSDKElement"></div>

    <script src="https://source.zoom.us/3.8.0/zoom-meeting-embedded-3.8.0.min.js"></script>

    <script>
        async function initZoom() {
            try {
                const params = new URLSearchParams(window.location.search);
                const meetingNumber = params.get('mn');
                const userName = params.get('name') || 'Student';
                const userEmail = params.get('email') || '';
                const password = params.get('pwd') || '';
                const role = parseInt(params.get('role') || '0', 10);

                if (!meetingNumber) {
                    throw new Error("Meeting Number is missing");
                }

                const response = await fetch("/api/zoom/signature?t=" + new Date().getTime(), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ meetingNumber, role }),
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Failed to get signature");
                }

                const { signature, sdkKey } = data;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('meetingSDKElement').style.display = 'block';

                const client = ZoomMtgEmbedded.createClient();

                let initOptions = {
                    zoomAppRoot: document.getElementById('meetingSDKElement'),
                    language: 'en-US',
                    customize: {
                        meetingInfo: ["topic", "host", "mn", "pwd", "telPwd", "invite", "participant", "dc", "enctype"],
                        toolbar: {
                            buttons: [
                                {
                                    text: 'Leave',
                                    className: 'CustomButton',
                                    onClick: () => {
                                        window.location.href = window.location.origin + '/zoom-ended.html';
                                    }
                                }
                            ]
                        }
                    }
                };

                client.init(initOptions);

                client.join({
                    sdkKey: sdkKey,
                    signature: signature,
                    meetingNumber: meetingNumber,
                    password: password,
                    userName: userName,
                    userEmail: userEmail
                }).then(() => {
                    console.log('Successfully joined Zoom meeting (Component View)');
                }).catch((error) => {
                    console.error('Join error', error);
                    alert("Failed to join meeting: " + JSON.stringify(error));
                });

            } catch (error) {
                console.error("Zoom initialization failed:", error);
                document.getElementById('loading').style.display = 'flex';
                document.getElementById('loading').innerHTML = '<div style="color: #f87171; text-align: center;"><h3 style="margin-bottom: 8px;">Connection Error</h3><p>' + error.message + '</p></div>';
            }
        }

        window.addEventListener('load', initZoom);
    </script>
</body>
</html>
